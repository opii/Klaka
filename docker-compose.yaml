# Ceo projekat lokalno, bez ičega instaliranog osim Docker-a.
#
#   docker compose up -d --wait                  PostgreSQL (+pgvector), Valkey, Ollama + naš sistem
#   docker compose run --rm rust cargo check     Rust alati (core/)
#   docker compose run --rm node npm run build   Node alati (radni folder: ts/)
#
# Prvo pokretanje preuzima Ollama modele (nekoliko GB) — klaka-engine čeka da se završi.
# Lozinke su razvojne podrazumevane vrednosti; menjaju se u .env (vidi .env.example).
# Portovi su vezani samo za 127.0.0.1, u opsegu 1xxxx (da se ne sudare sa drugim projektima).

name: klaka

x-core-env: &core-env
  KLAKA_POSTGRES_URL: postgres://${POSTGRES_USER:-klaka}:${POSTGRES_PASSWORD:-klaka-dev}@postgres:5432/${POSTGRES_DB:-klaka}
  KLAKA_VALKEY_URL: redis://valkey:6379/0
  KLAKA_OLLAMA_URL: http://ollama:11434
  KLAKA_LLM_MODEL: ${KLAKA_LLM_MODEL:-gemma3:4b}
  # Opis kohorte za recenzenta (G2/G3): veći model, izabran merenjem (docs/llm.md §7).
  KLAKA_DESCRIBE_MODEL: ${KLAKA_DESCRIBE_MODEL:-gemma3:12b}
  KLAKA_EMBED_MODEL: ${KLAKA_EMBED_MODEL:-bge-m3}

x-core: &core
  image: klaka-core:dev
  build:
    context: ./core
  restart: "no"
  environment: *core-env
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }

x-dev-user: &dev-user
  user: "${UID:-1000}:${GID:-1000}"

services:
  # --- infrastruktura -------------------------------------------------------

  # PostgreSQL 17 + pgvector: događaji (particije po danu), stanje, audit, embeddings (HNSW).
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klaka-dev}
      POSTGRES_DB: ${POSTGRES_DB:-klaka}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./core/deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.0
    ports: ["127.0.0.1:${VALKEY_PORT:-16379}:6379"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  # Lokalni LLM i embeddings (Ollama, otvoreni modeli).
  # Modeli se preuzimaju po imenu pri prvom pokretanju (ollama-pull) i čuvaju u volumenu.
  ollama:
    image: ollama/ollama:0.40.6
    ports: ["127.0.0.1:${OLLAMA_PORT:-18434}:11434"]
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "for m in \"$$0\" \"$$@\"; do ollama pull \"$$m\" || exit 1; done"]
    command: ["${KLAKA_LLM_MODEL:-gemma3:4b}", "${KLAKA_EMBED_MODEL:-bge-m3}", "${KLAKA_DESCRIBE_MODEL:-gemma3:12b}"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  # --- naš sistem (core/) ---------------------------------------------------

  klaka-collector:
    <<: *core
    command: ["klaka-collector"]
    ports: ["127.0.0.1:${COLLECTOR_PORT:-18080}:8080"]
    environment:
      <<: *core-env
      KLAKA_PORTALS: ${KLAKA_PORTALS:-demo.local}
      KLAKA_API_KEYS: ${KLAKA_API_KEYS:-demo.local=dev-api-key}
      KLAKA_RETENTION_DAYS: ${KLAKA_RETENTION_DAYS:-30}
      # Samo test okruženje: emulator klake (caci/) dodeljuje adrese preko ovog zaglavlja.
      KLAKA_CLIENT_IP_HEADER: x-forwarded-for

  klaka-api:
    <<: *core
    command: ["klaka-api"]
    # 8083: UI recenzenta — poseban listener, samo na 127.0.0.1 (verdicts.md §6).
    ports: ["127.0.0.1:${API_PORT:-18081}:8081", "127.0.0.1:${REVIEW_PORT:-18083}:8083"]
    environment:
      <<: *core-env
      KLAKA_PORTALS: ${KLAKA_PORTALS:-demo.local}
      KLAKA_SIGNING_KID: ${KLAKA_SIGNING_KID:-dev-1}
      KLAKA_SIGNING_SEED: ${KLAKA_SIGNING_SEED:-}
      # Bez recenzenata nema UI-ja recenzenta.
      KLAKA_REVIEW_TOKENS: ${KLAKA_REVIEW_TOKENS:-}
      # Sa presude link na komentar u portalu (pogled „Rendgen").
      KLAKA_PORTAL_LINKS: ${KLAKA_PORTAL_LINKS:-demo.local=http://localhost:18082}
      # Samo test okruženje: emulator klake (caci/) dodeljuje adrese preko ovog zaglavlja.
      KLAKA_CLIENT_IP_HEADER: x-forwarded-for

  # Engine ne čeka preuzimanje modela (ollama-pull): dok embeddings model ne stigne, deljene
  # šablone vidi samo preko MinHash-a (kopije), a vezu sa Ollama-om pokušava svaki krug.
  klaka-engine:
    <<: *core
    command: ["klaka-engine"]
    environment:
      <<: *core-env
      KLAKA_ENGINE_INTERVAL_S: ${KLAKA_ENGINE_INTERVAL_S:-5}
      KLAKA_RETENTION_DAYS: ${KLAKA_RETENTION_DAYS:-30}

  # --- demo portal (demo/) --------------------------------------------------

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: klaka-demo:dev
    environment:
      KLAKA_PORTAL: demo.local
      KLAKA_API_URL: http://klaka-api:8081
      KLAKA_API_PUBLIC_URL: http://localhost:${API_PORT:-18081}
      KLAKA_VALKEY_URL: redis://valkey:6379/0
      KLAKA_COLLECTOR_URL: http://klaka-collector:8080
      KLAKA_COLLECTOR_PUBLIC_URL: http://localhost:${COLLECTOR_PORT:-18080}
      KLAKA_API_KEY: ${KLAKA_DEMO_API_KEY:-dev-api-key}
      # Baza portala, odvojena od Klakine (ista instanca); demo je napravi ako ne postoji.
      PORTAL_POSTGRES_URL: postgres://${POSTGRES_USER:-klaka}:${POSTGRES_PASSWORD:-klaka-dev}@postgres:5432/portal
      PORTAL_CID_SALT: ${PORTAL_CID_SALT:-}
      # Pogledi „Poslušnik" i „Rendgen" (javno | isključen); presude za Rendgen iz UI-ja recenzenta,
      # pod nalogom portala iz KLAKA_REVIEW_TOKENS (PORTAL_REVIEW_AUTH=ime:token).
      PORTAL_XRAY: ${PORTAL_XRAY:-javno}
      PORTAL_REVIEW_URL: http://klaka-api:8083
      PORTAL_REVIEW_AUTH: ${PORTAL_REVIEW_AUTH:-}
      PORTAL_REVIEW_PUBLIC_URL: http://localhost:${REVIEW_PORT:-18083}
      # Panel napada (/admin/napadi): admin lozinka i caci servis (caci-panel) iz browsera admina.
      # Bez lozinke panel je isključen — i tako ostaje na javnom serveru.
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
      PORTAL_CACI_URL: http://localhost:${CACI_PANEL_PORT:-18095}
      PORTAL_CACI_TOKEN: ${CACI_PANEL_TOKEN:-}
      # Uvoz vesti (src/ingest.ts): RSS izvori (`Ime=https://…`, zarezom; prazno = RTS, 021.rs,
      # Danas, N1) i urednik — lokalni model u ollama servisu.
      PORTAL_FEEDS: ${PORTAL_FEEDS:-}
      OLLAMA_URL: http://ollama:11434
      PORTAL_INGEST_MODEL: ${PORTAL_INGEST_MODEL:-gemma3:12b}
      # Samo test okruženje: emulator klake (caci/) dodeljuje adrese preko ovog zaglavlja.
      KLAKA_CLIENT_IP_HEADER: x-forwarded-for
    ports: ["127.0.0.1:${DEMO_PORT:-18082}:3000"]
    depends_on:
      klaka-api: { condition: service_started }
      klaka-collector: { condition: service_started }
      valkey: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # --- razvojni alati (docker compose run --rm <alat> …) --------------------

  # Test u pravom browseru. Mreža host-a: browser vidi iste adrese kao korisnik
  # (demo na localhost:18082, klaka-api na localhost:18081 — pravi CORS između dva origin-a).
  e2e:
    profiles: [tools]
    <<: *dev-user
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    network_mode: host
    working_dir: /work/demo
    volumes: [".:/work"]
    environment:
      BASE_URL: http://localhost:${DEMO_PORT:-18082}
      npm_config_cache: /work/.npm-docker
      HOME: /tmp
      # Panel napada (e2e/panel.spec.ts); bez lozinke se test preskače.
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-}
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]

  # Emulator klake (caci/, docs/caci.md): docker compose run --rm caci run profiles/rafal-0.json
  # Mreža hosta, kao e2e: browser (nivoi 2+) vidi iste adrese kao korisnik — snippet na
  # stranici zove klaka-api i collector na localhost portovima.
  caci: &caci
    profiles: [tools]
    <<: *dev-user
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    network_mode: host
    working_dir: /work/caci
    volumes: [".:/work"]
    environment: &caci-env
      npm_config_cache: /work/.npm-docker
      HOME: /tmp
      CACI_PORTAL_URL: http://localhost:${DEMO_PORT:-18082}
      CACI_API_URL: http://localhost:${API_PORT:-18081}
      CACI_COLLECTOR_URL: http://localhost:${COLLECTOR_PORT:-18080}
      CACI_POSTGRES_URL: postgres://${POSTGRES_USER:-klaka}:${POSTGRES_PASSWORD:-klaka-dev}@localhost:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-klaka}
      # Nivo 4: parafraze šablona preko lokalnog LLM-a (profil "paraphrase": true).
      CACI_OLLAMA_URL: http://localhost:${OLLAMA_PORT:-18434}
      CACI_LLM_MODEL: ${KLAKA_LLM_MODEL:-gemma3:4b}
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --silent && npm run -s build && node dist/src/index.js \"$$@\"", "caci"]
    depends_on:
      demo: { condition: service_started }

  # Panel napada (portal /admin/napadi): caci kao HTTP servis, samo na 127.0.0.1 hosta. Admin ga
  # zove iz browsera, uz token. Namerno van podrazumevanog `up` (emulator napada nije javan servis):
  #   docker compose --profile napadi up -d caci-panel
  # Deli caci/node_modules sa `caci` iz komandne linije: ne pokretati ih istovremeno pri startu.
  caci-panel:
    <<: *caci
    profiles: [napadi]
    environment:
      <<: *caci-env
      CACI_PANEL_ADDR: 127.0.0.1:${CACI_PANEL_PORT:-18095}
      CACI_PANEL_TOKEN: ${CACI_PANEL_TOKEN:-}
      CACI_PANEL_ORIGIN: http://localhost:${DEMO_PORT:-18082}
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --silent && npm run -s build && exec node dist/src/index.js serve"]
    restart: unless-stopped

  rust:
    profiles: [tools]
    <<: *dev-user
    build:
      context: ./core
      target: dev
    image: klaka-rust-dev:1.88
    working_dir: /work/core
    volumes: [".:/work"]
    environment:
      CARGO_HOME: /work/core/.cargo-docker
      CARGO_TARGET_DIR: /work/core/target

  node:
    profiles: [tools]
    <<: *dev-user
    image: node:22-bookworm-slim
    working_dir: /work/ts
    volumes: [".:/work"]
    environment:
      npm_config_cache: /work/.npm-docker

volumes:
  postgres-data:
  valkey-data:
  ollama-models:
