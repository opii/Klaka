# Ceo projekat lokalno, bez ičega instaliranog osim Docker-a.
#
#   docker compose up -d --wait                  PostgreSQL (+pgvector), Valkey, Ollama + naš sistem
#   docker compose run --rm rust cargo check     Rust alati (core/)
#   docker compose run --rm node npm run build   Node alati (radni folder: ts/)
#
# Prvo pokretanje preuzima Ollama modele (nekoliko GB) — klaka-engine čeka da se završi.
# Lozinke su razvojne podrazumevane vrednosti; menjaju se u .env (vidi .env.example).
# Portovi su vezani samo za 127.0.0.1, u opsegu 1xxxx (da se ne sudare sa drugim projektima).

name: klaka

x-core-env: &core-env
  KLAKA_POSTGRES_URL: postgres://${POSTGRES_USER:-klaka}:${POSTGRES_PASSWORD:-klaka-dev}@postgres:5432/${POSTGRES_DB:-klaka}
  KLAKA_VALKEY_URL: redis://valkey:6379/0
  KLAKA_OLLAMA_URL: http://ollama:11434
  KLAKA_LLM_MODEL: ${KLAKA_LLM_MODEL:-gemma3:4b}
  KLAKA_EMBED_MODEL: ${KLAKA_EMBED_MODEL:-bge-m3}

x-core: &core
  image: klaka-core:dev
  build:
    context: ./core
  restart: "no"
  environment: *core-env
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }

x-dev-user: &dev-user
  user: "${UID:-1000}:${GID:-1000}"

services:
  # --- infrastruktura -------------------------------------------------------

  # PostgreSQL 17 + pgvector: događaji (particije po danu), stanje, audit, embeddings (HNSW).
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klaka-dev}
      POSTGRES_DB: ${POSTGRES_DB:-klaka}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./core/deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.0
    ports: ["127.0.0.1:${VALKEY_PORT:-16379}:6379"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  # Lokalni LLM i embeddings (Ollama, otvoreni modeli).
  # Modeli se preuzimaju po imenu pri prvom pokretanju (ollama-pull) i čuvaju u volumenu.
  ollama:
    image: ollama/ollama:0.40.6
    ports: ["127.0.0.1:${OLLAMA_PORT:-18434}:11434"]
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull \"$$0\" && ollama pull \"$$1\""]
    command: ["${KLAKA_LLM_MODEL:-gemma3:4b}", "${KLAKA_EMBED_MODEL:-bge-m3}"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  # --- naš sistem (core/) ---------------------------------------------------

  klaka-collector:
    <<: *core
    command: ["klaka-collector"]
    ports: ["127.0.0.1:${COLLECTOR_PORT:-18080}:8080"]
    environment:
      <<: *core-env
      KLAKA_PORTALS: ${KLAKA_PORTALS:-demo.local}
      KLAKA_API_KEYS: ${KLAKA_API_KEYS:-demo.local=dev-api-key}
      KLAKA_RETENTION_DAYS: ${KLAKA_RETENTION_DAYS:-30}

  klaka-api:
    <<: *core
    command: ["klaka-api"]
    ports: ["127.0.0.1:${API_PORT:-18081}:8081"]
    environment:
      <<: *core-env
      KLAKA_PORTALS: ${KLAKA_PORTALS:-demo.local}
      KLAKA_SIGNING_KID: ${KLAKA_SIGNING_KID:-dev-1}
      KLAKA_SIGNING_SEED: ${KLAKA_SIGNING_SEED:-}

  klaka-engine:
    <<: *core
    command: ["klaka-engine"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      ollama-pull: { condition: service_completed_successfully }

  # --- demo portal (demo/) --------------------------------------------------

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: klaka-demo:dev
    environment:
      KLAKA_PORTAL: demo.local
      KLAKA_API_URL: http://klaka-api:8081
      KLAKA_API_PUBLIC_URL: http://localhost:${API_PORT:-18081}
      KLAKA_VALKEY_URL: redis://valkey:6379/0
      KLAKA_COLLECTOR_URL: http://klaka-collector:8080
      KLAKA_API_KEY: ${KLAKA_DEMO_API_KEY:-dev-api-key}
      # Samo test okruženje: emulator klake (caci/) dodeljuje adrese preko ovog zaglavlja.
      KLAKA_CLIENT_IP_HEADER: x-forwarded-for
    ports: ["127.0.0.1:${DEMO_PORT:-18082}:3000"]
    depends_on:
      klaka-api: { condition: service_started }
      klaka-collector: { condition: service_started }
      valkey: { condition: service_healthy }

  # --- razvojni alati (docker compose run --rm <alat> …) --------------------

  # Test u pravom browseru. Mreža host-a: browser vidi iste adrese kao korisnik
  # (demo na localhost:18082, klaka-api na localhost:18081 — pravi CORS između dva origin-a).
  e2e:
    profiles: [tools]
    <<: *dev-user
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    network_mode: host
    working_dir: /work/demo
    volumes: [".:/work"]
    environment:
      BASE_URL: http://localhost:${DEMO_PORT:-18082}
      npm_config_cache: /work/.npm-docker
      HOME: /tmp
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]

  # Emulator klake (caci/, docs/caci.md): docker compose run --rm caci run profiles/rafal-0.json
  caci:
    profiles: [tools]
    <<: *dev-user
    image: node:22-bookworm-slim
    working_dir: /work/caci
    volumes: [".:/work"]
    environment:
      npm_config_cache: /work/.npm-docker
      CACI_PORTAL_URL: http://demo:3000
      CACI_API_URL: http://klaka-api:8081
      CACI_POSTGRES_URL: postgres://${POSTGRES_USER:-klaka}:${POSTGRES_PASSWORD:-klaka-dev}@postgres:5432/${POSTGRES_DB:-klaka}
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --silent && npm run -s build && node dist/src/index.js \"$$@\"", "caci"]
    depends_on:
      demo: { condition: service_started }

  rust:
    profiles: [tools]
    <<: *dev-user
    build:
      context: ./core
      target: dev
    image: klaka-rust-dev:1.88
    working_dir: /work/core
    volumes: [".:/work"]
    environment:
      CARGO_HOME: /work/core/.cargo-docker
      CARGO_TARGET_DIR: /work/core/target

  node:
    profiles: [tools]
    <<: *dev-user
    image: node:22-bookworm-slim
    working_dir: /work/ts
    volumes: [".:/work"]
    environment:
      npm_config_cache: /work/.npm-docker

volumes:
  postgres-data:
  valkey-data:
  ollama-models:
