[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
klaka-core = { path = "crates/klaka-core" }
klaka-db = { path = "crates/klaka-db" }
klaka-llm = { path = "crates/klaka-llm" }
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json"] }
# samo za testove
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
